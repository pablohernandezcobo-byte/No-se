    <path d="M448,428 C470,478 530,478 552,428 C530,438 470,438 448,428 Z" fill="#5C1A1E"/>
    <path d="M456,432 C480,440 520,440 544,432 L538,446 C516,452 484,452 462,446 Z" fill="#FFFFFF" stroke-width="3"/>
    <path d="M478,458 C492,466 508,466 522,458" fill="none" stroke="#E86A6A" stroke-width="8"/>
    <!-- mejillas / líneas de sonrisa -->
    <path d="M430,404 C426,420 432,436 442,444 M570,404 C574,420 568,436 558,444" fill="none" stroke="#B87452" stroke-width="5"/>
    <!-- NARIZ -->
    <path d="M502,336 C496,362 486,380 488,388 C496,396 508,396 516,388" fill="none" stroke="#B87452" stroke-width="6"/>
    <!-- OJOS (sonrientes) -->
    <path d="M424,334 C440,316 460,316 474,332" fill="none" stroke="#0E1326" stroke-width="8"/>
    <path d="M526,332 C540,316 560,316 576,334" fill="none" stroke="#0E1326" stroke-width="8"/>
    <path d="M428,346 C444,352 458,352 470,346 M530,346 C542,352 556,352 572,346" fill="none" stroke="#B87452" stroke-width="4"/>
    <!-- CEJAS -->
    <path d="M416,302 C436,284 458,282 480,294" fill="none" stroke="#2A190F" stroke-width="14"/>
    <path d="M520,294 C542,282 564,284 584,302" fill="none" stroke="#2A190F" stroke-width="14"/>
    <!-- PELO: degradado a los lados + volumen arriba -->
    <path d="M388,336 C384,300 386,276 394,258 L404,262 C398,284 396,310 398,336 Z M612,336 C616,300 614,276 606,258 L596,262 C602,284 604,310 602,336 Z" fill="#5A3A26" stroke-width="0" opacity=".85"/>
    <path d="M388,280 C380,232 404,190 446,174 C462,152 500,144 528,156 C566,148 606,170 616,208 C630,236 626,262 614,282 C606,262 590,250 572,244 C560,252 540,256 520,250 C500,244 476,246 456,252 C430,256 404,262 388,280 Z" fill="url(#hair)"/>
    <path d="M450,200 C470,186 494,182 512,190 M520,176 C548,170 576,180 592,200 M430,226 C452,214 476,212 494,218" fill="none" stroke="#6B4630" stroke-width="5"/>
  </g>
</svg>
