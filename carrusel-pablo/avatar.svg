<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1100" width="1000" height="1100">
  <!-- Avatar de Pablo · ilustración vectorial basada en su foto -->
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F0B48C"/><stop offset="1" stop-color="#D99470"/></linearGradient>
    <linearGradient id="armL" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#C98460"/><stop offset=".55" stop-color="#E8A882"/><stop offset="1" stop-color="#D99470"/></linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2D6BFF"/><stop offset="1" stop-color="#1238B8"/></linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4A2E1C"/><stop offset="1" stop-color="#2A190F"/></linearGradient>
    <radialGradient id="rim" cx=".5" cy=".5" r=".5"><stop offset=".7" stop-color="#3EF2FF" stop-opacity="0"/><stop offset="1" stop-color="#3EF2FF" stop-opacity=".55"/></radialGradient>
  </defs>
  <g stroke="#0E1326" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">

    <!-- BRAZO IZQUIERDO (del espectador) -->
    <g id="arm">
      <!-- antebrazo -->
      <path d="M150,640 C112,575 112,488 140,418 L222,412 C226,478 214,548 214,612 Z" fill="url(#armL)"/>
      <path d="M150,600 C140,540 145,480 160,430" fill="none" stroke="#B87452" stroke-width="5" opacity=".7"/>
