// ============================================================

const W = 1080, H = 1920, CX = W / 2;

const cv = document.getElementById('c'); cv.width = W; cv.height = H;
const out = cv.getContext('2d');
const mk = () => { const c = document.createElement('canvas'); c.width = W; c.height = H; return c; };
const buf = mk(), ctx = buf.getContext('2d');
const tA = mk(), aC = tA.getContext('2d'), tB = mk(), bC = tB.getContext('2d'), tC = mk(), cC = tC.getContext('2d');
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const eOutExpo = x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x);

const eInOutCubic = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eInOutExpo = x => x <= 0 ? 0 : x >= 1 ? 1 : x < .5 ? Math.pow(2, 20 * x - 10) / 2 : (2 - Math.pow(2, -20 * x + 10)) / 2;
const eOutBack = x => { const c1 = 2.2, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const P = (s, w = 900) => `${w} ${s}px Poppins`;

function mw(str, size, weight = 900) { ctx.save(); ctx.font = P(size, weight); ctx.letterSpacing = '0px'; const w = ctx.measureText(str).width; ctx.restore(); return w; }

// ---------- registro de eventos de sonido ----------
const EVENTS = [];
const ev = (t, type, g = 1) => EVENTS.push({ t: +t.toFixed(3), type, g });

// ---------- efectos de texto ----------
// palabras que golpean: escala grande → 1, con estela azul
function slam(str, x, y, size, color, lt, t0, o = {}) {
  const { stagger = 0.09, align = 'left', weight = 900, from = 2.0 } = o;

  parts.forEach((p, i) => {
    const k = seg(lt, t0 + i * stagger, t0 + i * stagger + 0.32);
    if (k > 0) {
      const e = eOutExpo(k), s = lerp(from, 1, e), cx = xx + ws[i] / 2;

}
// línea con barra de rotulador que barre por detrás
function marker(str, x, y, size, lt, t0) {
  const w = mw(str, size), k = eInOutExpo(seg(lt, t0, t0 + 0.35));

// párrafo: líneas que entran desde la izquierda; palabras destacadas subrayadas en cian
function rich(parts, x, y, maxW, size, lh, lt, t0) {
  const toks = []; parts.forEach(([s, b]) => s.split(' ').filter(Boolean).forEach(w => toks.push([w, b])));

  toks.forEach(tk => { const w = mw(tk[0] + ' ', size, tk[1] ? 700 : 500); if (lw + w > maxW && lines[lines.length - 1].length) { lines.push([]); lw = 0; } lines[lines.length - 1].push(tk); lw += w; });

    const k = eOutExpo(seg(lt, t0 + i * 0.13, t0 + i * 0.13 + 0.4)); if (k <= 0) return;
    let xx = x; ctx.save(); ctx.globalAlpha = k; ctx.translate((1 - k) * -120, 0);

      const ww = mw(w + ' ', size, b ? 700 : 500);

      T(w, xx, y + i * lh, size, b ? '#fff' : MUTED, { weight: b ? 700 : 500, align: 'left' }); xx += ww;
    });

  });
  return lines.length;
}

// ---------- fondo, foto, personaje ----------

}

}

// ---------- escenas ----------
const TIPS = [
  { t: ['CALIENTA CON SERIES', 'DE APROXIMACIÓN'], k: '2–3 SERIES', ks: 'LIGERAS, SUBIENDO EL PESO', img: 'mancuernas', f: 0.2, p: [['Además de calentar,'], ['te van a ayudar a mejorar mucho tu rendimiento:', 1], ['llegas a tus series fuertes con más fuerza.']] },
  { t: ['DESCANSA DE VERDAD', 'ENTRE SERIES'], k: '2–3 MIN', ks: 'EN LOS EJERCICIOS GRANDES', img: 'selfie', f: 0.0, p: [['Si descansas poco,'], ['levantas menos peso y haces menos repeticiones.', 1], ['Y eso es progresar menos.']] },
  { t: ['USA EL RECORRIDO', 'COMPLETO'], k: 'RANGO COMPLETO', ks: 'Y BAJADA CONTROLADA', img: 'sentadilla', f: 0.45, p: [['Medias repeticiones, medio resultado.'], ['Baja controlando y estira el músculo:', 1], ['ahí está gran parte del estímulo.']] },
  { t: ['MUÉVETE', 'FUERA DEL GYM'], k: '8.000–10.000', ks: 'PASOS AL DÍA', img: 'mochila', f: 0.1, p: [['Una hora de entreno no compensa 23 horas sentado.'], ['Caminar es clave para perder grasa.', 1]] },
  { t: ['LA CREATINA', 'FUNCIONA'], k: '3–5 G / DÍA', ks: 'MONOHIDRATO, TODOS LOS DÍAS', img: 'press_banca', f: 0.15, p: [['El suplemento con'], ['más evidencia para ganar fuerza y músculo.', 1], ['También los días de descanso.']] },
];
const TL = { photo: 0, badge: 0.15, num: 0.3, t0: 0.32, mark: 0.62, key: 0.8, scr: 0.86, par: 1.15 };

function sCover(lt, t) {
  background(t, 0.66);
  const kc = eOutExpo(seg(lt, 0.05, 0.9)), z = lerp(1.25, 1, kc) + lt * 0.012;
  ctx.save(); ctx.translate(CX, 1920); ctx.scale(z, z); ctx.translate(-CX, -1920);
  character(CX, 520 + (1 - kc) * 260, 1180, kc); ctx.restore();
  // "5" con onda expansiva
  const k5 = seg(lt, 0.35, 0.6), w5 = mw('5', 196), wc = mw(' CLAVES', 196), x0 = CX - (w5 + wc) / 2;
  if (k5 > 0) {
    const s = lerp(4, 1, eOutExpo(k5));
    ctx.save(); ctx.translate(x0 + w5 / 2, 262); ctx.scale(s, s); ctx.rotate((1 - eOutExpo(k5)) * -0.3); ctx.globalAlpha = Math.min(1, k5 * 3); T('5', 0, 68, 196, BLUE2); ctx.restore();

  }
  // CLAVES letra a letra cayendo
  let xx = x0 + w5 + mw(' ', 196);
  [...'CLAVES'].forEach((ch, i) => { const k = seg(lt, 0.55 + i * 0.05, 0.85 + i * 0.05); if (k > 0) { const e = eOutBack(k); ctx.save(); ctx.globalAlpha = Math.min(1, k * 4); T(ch, xx, 330 - (1 - e) * 160, 196, '#fff', { align: 'left' }); ctx.restore(); } xx += mw(ch, 196); });
  // subtítulo máquina de escribir
  const sub1 = 'QUE VAN A ACELERAR TUS', sub2 = 'RESULTADOS EN EL GIMNASIO';
  const n1 = Math.floor(clamp((lt - 0.95) * 45, 0, sub1.length)), n2 = Math.floor(clamp((lt - 0.95 - sub1.length / 45) * 45, 0, sub2.length));
  if (n1 > 0) T(sub1.slice(0, n1), CX, 430, 58, '#fff', { weight: 800 });
  if (n2 > 0) T(sub2.slice(0, n2), CX, 500, 58, '#fff', { weight: 800 });

  const kb = seg(lt, 2.0, 2.45);
  if (kb > 0) { const s = eOutBack(Math.min(1, kb * 1.5)); ctx.save(); ctx.translate(CX + (kb < 0.6 ? (rng(Math.floor(t * 30))() - 0.5) * 30 : 0), 590); ctx.scale(s, s); rr(-260, -36, 520, 64, 32); ctx.fillStyle = BLUE; ctx.fill(); T(scramble('LA 5 ES LA MÁS IGNORADA', kb * 1.3, t, 3), 0, 10, 28, '#fff', { weight: 800 }); ctx.restore(); }
  handle(700, eOutExpo(seg(lt, 2.2, 2.6)), CX - 240);
}
function sTip(i, lt, t) {
  background(t, 0.75, 0.6);
  const tip = TIPS[i];
  const kr = eInOutExpo(seg(lt, -0.25, 0.35)), punch = Math.exp(-Math.max(0, lt - TL.num) * 6) * (lt > TL.num ? 1 : 0);
  ctx.save(); ctx.beginPath(); ctx.rect(0, 1180 * (1 - kr), W, 1180); ctx.clip();
  photo(tip.img, 0, 1180, lt, tip.f, i % 2 ? -1 : 1, punch); ctx.restore();
  // destello de luz que cruza la foto
  const ks = seg(lt, 0.25, 0.7); if (ks > 0 && ks < 1) { const x = lerp(-400, W + 400, ks); const g = ctx.createLinearGradient(x - 200, 0, x + 200, 0); g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(0.5, 'rgba(160,210,255,0.35)'); g.addColorStop(1, 'rgba(255,255,255,0)'); ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = g; ctx.fillRect(0, 0, W, 1180); ctx.restore(); }

  const kk = eInOutExpo(seg(lt, TL.key, TL.key + 0.3));
  if (kk > 0) {
    const kw = Math.max(mw(tip.k, 72), mw(tip.ks, 26, 600)) + 70;
    rr(64, 1000, kw * kk, 150, 28); ctx.fillStyle = 'rgba(2,4,12,0.86)'; ctx.fill(); ctx.strokeStyle = BLUE2; ctx.lineWidth = 4; ctx.stroke();
    ctx.save(); ctx.beginPath(); ctx.rect(64, 1000, kw * kk, 150); ctx.clip();
    const kscr = seg(lt, TL.scr, TL.scr + 0.45);
    T(scramble(tip.k, kscr, t, i + 9), 99, 1084, 72, CYAN, { align: 'left' }); T(tip.ks, 99, 1128, 26, MUTED, { weight: 600, align: 'left', alpha: seg(lt, TL.scr + 0.2, TL.scr + 0.5) });
    ctx.restore();
  }
  // título: palabras que golpean + línea 2 con rotulador
  const ts = Math.min(92, 92 * 950 / Math.max(mw(tip.t[0], 92), mw(tip.t[1], 92)));
  slam(tip.t[0], 64, 1210 + ts, ts, '#fff', lt, TL.t0);
  marker(tip.t[1], 72, 1225 + ts * 2.05, ts, lt, TL.mark);
  rich(tip.p, 64, 1230 + ts * 2 + 100, 950, 40, 58, lt, TL.par);
}
function sCTA(lt, t) {

  const kr = eOutExpo(seg(lt, 0, 0.6));
  ctx.save(); ctx.globalAlpha = eOutExpo(seg(lt, -0.25, 0.4)); photo('remo', 640, 1280, lt, 0.0, 1, Math.exp(-Math.max(0, lt) * 5)); ctx.restore();

  slam('¿CUÁL VAS A', CX, 300, 110, '#fff', lt, 0.05, { align: 'center', from: 2.4 });
  const wl = mw('APLICAR HOY?', 110); marker('APLICAR HOY?', CX - wl / 2, 420, 110, lt, 0.35);
  const kd = seg(lt, 0.8, 1.15);

    ctx.save(); ctx.translate(CX + (1 - eOutExpo(kd)) * 700, 560); ctx.scale(pulse, pulse);

    const w1 = mw('Escríbeme', 46, 800), w2 = mw('PLAN', 46) + 40, w3 = mw('por DM', 46, 800), tw = w1 + w2 + w3 + 48; let xx = -tw / 2;
    T('Escríbeme', xx, 18, 46, '#fff', { weight: 800, align: 'left' }); xx += w1 + 24;
    rr(xx, -36, w2, 72, 16); ctx.fillStyle = BG; ctx.fill(); T(scramble('PLAN', seg(lt, 1.0, 1.35), t, 5), xx + w2 / 2, 18, 46, '#fff'); xx += w2 + 24;
    T('por DM', xx, 18, 46, '#fff', { weight: 800, align: 'left' });
    ctx.restore();

    for (const tt of [1.6, 2.7]) { const k = seg(lt, tt, tt + 0.5); if (k > 0 && k < 1) { ctx.strokeStyle = `rgba(255,255,255,${1 - k})`; ctx.lineWidth = 5; circ(CX + 250, 575, 20 + k * 90); ctx.stroke(); ctx.fillStyle = `rgba(255,255,255,${0.6 * (1 - k)})`; circ(CX + 250, 575, 22); ctx.fill(); } }
  }

  handle(1500, eOutExpo(seg(lt, 1.9, 2.3)));
}
const SCENES = [(lt, t) => sCover(lt, t), ...TIPS.map((_, i) => (lt, t) => sTip(i, lt, t)), (lt, t) => sCTA(lt, t)];
function drawScene(i, t) { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; SCENES[i](t - STARTS[i], t); }

// ---------- transiciones (una distinta en cada cambio) ----------
const TRANS = ['zoom', 'whipX', 'glitch', 'iris', 'stripes', 'whipY'];
const TW = 0.22;
function transition(type, u, t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);

    if (u < 0.5) { const k = eInExpo(u * 2); for (let g = 4; g >= 0; g--) { const s = 1 + k * (0.8 + g * 0.08); ctx.globalAlpha = g ? 0.15 * k : 1 - k * 0.6; ctx.save(); ctx.translate(CX, H / 2); ctx.scale(s, s); ctx.translate(-CX, -H / 2); ctx.drawImage(tA, 0, 0); ctx.restore(); } }
    else { const k = eOutExpo((u - 0.5) * 2), s = lerp(0.6, 1, k); ctx.globalAlpha = k; ctx.save(); ctx.translate(CX, H / 2); ctx.scale(s, s); ctx.translate(-CX, -H / 2); ctx.drawImage(tB, 0, 0); ctx.restore(); }
  } else if (type === 'whipX' || type === 'whipY') {

}

// ---------- render ----------
let GRAIN;
function render(t) {
  let i = STARTS.findIndex((s, k) => t >= s && t < STARTS[k + 1]); if (i < 0) i = SCENES.length - 1;
  let j = -1; for (let k = 1; k < SCENES.length; k++) if (Math.abs(t - STARTS[k]) < TW) j = k;
  if (j > 0) {
    drawScene(j - 1, t); aC.drawImage(buf, 0, 0); drawScene(j, t); bC.drawImage(buf, 0, 0);
    transition(TRANS[j - 1], seg(t, STARTS[j] - TW, STARTS[j] + TW), t);
  } else drawScene(i, t);
  const fo = seg(t, DUR - 0.35, DUR); if (fo > 0) { ctx.fillStyle = `rgba(0,0,0,${fo})`; ctx.fillRect(0, 0, W, H); }
  // cámara: golpe en cada evento fuerte
  let hit = 0; for (const e of EVENTS) if ((e.type === 'impact' || e.type === 'boom') && t >= e.t && t < e.t + 0.6) hit = Math.max(hit, Math.exp(-(t - e.t) * 9) * e.g);
  const z = 1 + 0.01 * beatEnv(t) + 0.05 * hit, sh = 14 * hit, ca = 1 + 12 * hit;
  out.setTransform(1, 0, 0, 1, 0, 0); out.globalCompositeOperation = 'source-over'; out.globalAlpha = 1; out.fillStyle = '#000'; out.fillRect(0, 0, W, H);
  out.save(); out.translate(CX + Math.sin(t * 91) * sh, H / 2 + Math.cos(t * 73) * sh); out.scale(z, z); out.translate(-CX, -H / 2);
  if (ca > 2) { out.globalCompositeOperation = 'lighter'; [['#ff0000', -ca], ['#00ff00', 0], ['#0000ff', ca]].forEach(([c, dx]) => { cC.globalCompositeOperation = 'source-over'; cC.drawImage(buf, 0, 0); cC.globalCompositeOperation = 'multiply'; cC.fillStyle = c; cC.fillRect(0, 0, W, H); out.drawImage(tC, dx, 0); }); out.globalCompositeOperation = 'source-over'; }
  else out.drawImage(buf, 0, 0);
  out.restore();
  out.globalCompositeOperation = 'overlay'; out.globalAlpha = 0.05; out.drawImage(GRAIN[Math.floor(t * 30) % 4], 0, 0, W, H);
  out.globalCompositeOperation = 'source-over'; out.globalAlpha = 1;
}

// ---------- lista de eventos de sonido (misma fuente de tiempos que las animaciones) ----------
function buildEvents() {
  const C = STARTS[0];
  ev(C + 0.05, 'whoosh_up', 0.7); ev(C + 0.35, 'boom', 1); ev(C + 0.5, 'shock', 0.8);
  for (let i = 0; i < 6; i++) ev(C + 0.55 + i * 0.05, 'tick', 0.5);
  const s1 = 'QUE VAN A ACELERAR TUS'.length, s2 = 'RESULTADOS EN EL GIMNASIO'.length;
  for (let k = 0; k < s1 + s2; k += 2) ev(C + 0.95 + k / 45, 'type', 0.35);
  ev(C + 2.0, 'glitch', 0.6); ev(C + 2.2, 'pop', 0.5);
  TIPS.forEach((tip, i) => {
    const S = STARTS[i + 1], nw = tip.t[0].split(' ').length, lines = Math.ceil((tip.p.map(x => x[0]).join(' ').length) / 46);
    ev(S + TL.badge, 'pop', 0.8); ev(S + TL.num, 'impact', 0.8); ev(S + 0.25, 'shine', 0.4);
    for (let w = 0; w < nw; w++) ev(S + TL.t0 + w * 0.09, 'thud', 0.55);
    ev(S + TL.mark, 'swipe', 0.8); ev(S + TL.key, 'pop', 0.7); ev(S + TL.scr, 'glitch', 0.5);
    for (let l = 0; l < lines; l++) ev(S + TL.par + l * 0.13, 'tick', 0.35);
  });
  for (let j = 1; j < SCENES.length; j++) {
    const S = STARTS[j];
    ev(S - 0.75, 'riser', 0.5); ev(S - TW, TRANS[j - 1] === 'glitch' ? 'glitch_tr' : 'whoosh', 1); ev(S, 'impact', 0.6);
  }
  const Z = STARTS[6];
  ev(Z + 0.05, 'thud', 0.6); ev(Z + 0.12, 'thud', 0.6); ev(Z + 0.35, 'swipe', 0.8); ev(Z + 0.8, 'whoosh', 0.6); ev(Z + 1.0, 'glitch', 0.5);
  ev(Z + 1.6, 'tap', 0.9); ev(Z + 2.7, 'tap', 0.9); ev(Z + 1.9, 'pop', 0.5); ev(DUR - 1.2, 'boom', 0.7);
  EVENTS.sort((a, b) => a.t - b.t);
}
window.ready = (async () => {
  IMG = new Image(); IMG.src = window.PERSONAJE; await IMG.decode();
  for (const [k, v] of Object.entries(window.POSES)) { const im = new Image(); im.src = v; await im.decode(); PIM[k] = im; }
  for (const w of [500, 600, 700, 800, 900]) await document.fonts.load(`${w} 50px Poppins`);
  const r = rng(9); GRAIN = [];
  for (let k = 0; k < 4; k++) { const c = document.createElement('canvas'); c.width = 540; c.height = 960; const g = c.getContext('2d'), im = g.createImageData(540, 960); for (let j = 0; j < im.data.length; j += 4) { const v = r() * 255; im.data[j] = im.data[j + 1] = im.data[j + 2] = v; im.data[j + 3] = 255; } g.putImageData(im, 0, 0); GRAIN.push(c); }
  buildEvents(); render(0); return true;
})();
window.frame = (t, q = 0.95) => { render(t); return cv.toDataURL('image/jpeg', q); };
window.DUR = DUR; window.EVENTS = EVENTS;
</script></body></html>
