<!doctype html>
<html><head><meta charset="utf-8"><title>Mito vs Realidad 01 v2</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body><canvas id="c"></canvas>
<script>
// ============================================================
//  MITO vs REALIDAD #01 (v2) — paleta "Noche + Cítrico"
//  Reel 9:16 · 1080x1920 · 100 BPM (beat 0.6 s) · 7 pantallas
// ============================================================
const W = 1080, H = 1920, CX = W / 2, DUR = 35.4;
const NIGHT = [15, 22, 48], NIGHT2 = [34, 44, 92], ORANGE = [255, 138, 31], ORANGE2 = [255, 186, 92], CREAM = [255, 247, 236], WHITE = [255, 255, 255];
const NAVY = '#0F1630', OR = '#FF8A1F', ORD = '#E86F00', MUTED = 'rgba(15,22,48,0.6)', MUTEDL = 'rgba(255,255,255,0.72)';

const cv = document.getElementById('c'); cv.width = W; cv.height = H;
const out = cv.getContext('2d');
const mk = (w = W, h = H) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const buf = mk(), ctx = buf.getContext('2d');

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const mixc = (a, b, k) => a.map((v, i) => Math.round(lerp(v, b[i], k)));
const css = (c, a = 1) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
const eOutExpo = x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x);
const eInExpo = x => x <= 0 ? 0 : Math.pow(2, 10 * x - 10);
const eInOutCubic = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eOutBack = x => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const F = (s, w = 900, fam = 'Inter Display') => `${w} ${s}px "${fam}"`;
const MONO = s => `600 ${s}px "DejaVu Sans Mono"`;

function T(str, x, y, size, color, o = {}) {
  const { weight = 900, fam = 'Inter Display', align = 'center', ls = 0, alpha = 1, font, stroke = 0 } = o;
  ctx.save(); ctx.font = font || F(size, weight, fam); ctx.textAlign = align; ctx.textBaseline = 'alphabetic';
  ctx.letterSpacing = ls + 'px'; ctx.globalAlpha *= alpha;
  const xx = align === 'center' ? x + ls / 2 : x;
  if (stroke) { ctx.lineWidth = stroke; ctx.strokeStyle = color; ctx.lineJoin = 'round'; ctx.strokeText(str, xx, y); }
  else { ctx.fillStyle = color; ctx.fillText(str, xx, y); }
  ctx.restore();
}
function mw(str, size, weight = 900, fam = 'Inter Display', font) { ctx.save(); ctx.font = font || F(size, weight, fam); ctx.letterSpacing = '0px'; const w = ctx.measureText(str).width; ctx.restore(); return w; }
const fit = (str, maxW, maxS = 999, weight = 900) => Math.min(maxS, 100 * maxW / mw(str, 100, weight));
function words(str, x, y, size, color, lt, t0, o = {}) {
  const { stagger = 0.07, dur = 0.55, align = 'center', weight = 900, fam = 'Inter Display' } = o;
  const parts = str.split(' '), sp = mw(' ', size, weight, fam), ws = parts.map(p => mw(p, size, weight, fam));
  const total = ws.reduce((a, b) => a + b, 0) + sp * (parts.length - 1);
  let xx = align === 'center' ? x - total / 2 : x;
  ctx.save(); ctx.beginPath(); ctx.rect(0, y - size * 0.95, W, size * 1.22); ctx.clip();
  parts.forEach((p, i) => {
    const k = eOutExpo(seg(lt, t0 + i * stagger, t0 + i * stagger + dur));
    if (k > 0) T(p, xx, y + (1 - k) * size * 1.1, size, color, { align: 'left', weight, fam });
    xx += ws[i] + sp;
  });
  ctx.restore();
  return total;
}
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function circ(x, y, r) { ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, Math.PI * 2); }
function card(x, y, w, h, k = 1, r = 36, fill = '#fff', shadow = 'rgba(15,22,48,0.13)') {
  ctx.save(); ctx.globalAlpha *= k;
  ctx.shadowColor = shadow; ctx.shadowBlur = 50; ctx.shadowOffsetY = 18;
  ctx.fillStyle = fill; rr(x, y, w, h, r); ctx.fill(); ctx.restore();
}
function check(x, y, r, k, col = OR) {
  if (k <= 0) return;
  ctx.fillStyle = col; circ(x, y, r * eOutBack(Math.min(1, k * 1.6))); ctx.fill();
  const kk = seg(k, 0.35, 1);
  ctx.strokeStyle = '#fff'; ctx.lineWidth = r * 0.22; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const p = [[x - r * 0.42, y + r * 0.02], [x - r * 0.1, y + r * 0.32], [x + r * 0.45, y - r * 0.3]];
  ctx.beginPath(); ctx.moveTo(...p[0]);
  if (kk < 0.4) ctx.lineTo(lerp(p[0][0], p[1][0], kk / 0.4), lerp(p[0][1], p[1][1], kk / 0.4));
  else { ctx.lineTo(...p[1]); const q = (kk - 0.4) / 0.6; ctx.lineTo(lerp(p[1][0], p[2][0], q), lerp(p[1][1], p[2][1], q)); }
  ctx.stroke();
}
function cross(x, y, r, k) {
  if (k <= 0) return;
  ctx.fillStyle = 'rgba(15,22,48,0.25)'; circ(x, y, r * eOutBack(Math.min(1, k * 1.6))); ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = r * 0.2; ctx.lineCap = 'round';
  const a = seg(k, 0.3, 0.65), b = seg(k, 0.65, 1), s = r * 0.36;
  ctx.beginPath(); ctx.moveTo(x - s, y - s); ctx.lineTo(x - s + 2 * s * a, y - s + 2 * s * a);
  if (b > 0) { ctx.moveTo(x + s, y - s); ctx.lineTo(x + s - 2 * s * b, y - s + 2 * s * b); }
  ctx.stroke();
}
function moon(x, y, r, col, glow = true) {
  if (glow) { const g = ctx.createRadialGradient(x, y, r * 0.5, x, y, r * 3.2); g.addColorStop(0, css(ORANGE, 0.35)); g.addColorStop(1, css(ORANGE, 0)); ctx.fillStyle = g; circ(x, y, r * 3.2); ctx.fill(); }
  ctx.save(); circ(x, y, r); ctx.clip(); ctx.beginPath(); ctx.rect(x - r, y - r, 2 * r, 2 * r); ctx.arc(x + r * 0.5, y - r * 0.32, r * 0.86, 0, Math.PI * 2); ctx.fillStyle = col; ctx.fill('evenodd'); ctx.restore();
}
function stars(lt, n = 50, seed = 3, ymax = 0.55) {
  const r = rng(seed);
  for (let s = 0; s < n; s++) { const x = r() * W, y = 200 + r() * H * ymax, ph = r() * 6, sz = 2 + r() * 3; ctx.fillStyle = `rgba(255,255,255,${0.25 + 0.6 * Math.abs(Math.sin(lt * 1.5 + ph))})`; circ(x, y, sz); ctx.fill(); }
}
function tag(txt, x, y, dark, k = 1, align = 'left') {
  const w = mw(txt, 24, 0, 0, MONO(24)) + 44;
  const xx = align === 'center' ? x - w / 2 : x;
  ctx.save(); ctx.globalAlpha *= k;
  rr(xx, y - 38, w, 54, 27); ctx.fillStyle = dark ? 'rgba(255,138,31,0.16)' : 'rgba(255,138,31,0.14)'; ctx.fill();
  T(txt, xx + 22, y - 3, 24, dark ? ORANGE2c() : ORD, { font: MONO(24), align: 'left' });
  ctx.restore();
}
const ORANGE2c = () => css(ORANGE2);
function pill(txt, y, bg, fg, k, size = 46) {
  if (k <= 0) return;
  ctx.save(); ctx.globalAlpha = k; ctx.translate(CX, y + (1 - k) * 30);
  const w = mw(txt, size) + 100; rr(-w / 2, -size * 1.38, w, size * 2.15, size * 1.08); ctx.fillStyle = bg; ctx.fill();
  T(txt, 0, 2, size, fg); ctx.restore();
}
const num = n => Math.round(n).toLocaleString('de-DE');

// ============================================================
//  ESCENAS
// ============================================================
// 1 · GANCHO (noche)
function s1(lt) {
  stars(lt, 40, 5, 0.35);
  const sC = fit('CARBOHIDRATOS', 960);
  words('¿CENAR', CX, 560, 170, '#fff', lt, 0.05);
  words('CARBOHIDRATOS', CX, 560 + 70 + sC, sC, OR, lt, 0.2);
  words('ENGORDA?', CX, 560 + 70 + sC + 195, 175, '#fff', lt, 0.35);
  const km = eOutBack(seg(lt, 0.4, 0.9));
  ctx.save(); ctx.globalAlpha = km; moon(880, 300 + (1 - km) * 50, 56, '#FFE7C2'); ctx.restore();
  bowl(CX, 1250, eOutBack(seg(lt, 0.6, 1.1)), lt);
  const kt = seg(lt, 1.2, 1.6);
  T('TE LO EXPLICO CON CIENCIA', CX, 1530, 32, MUTEDL, { font: MONO(32), alpha: kt, ls: 2 });
  T('↓', CX, 1610 + Math.sin(lt * 8) * 10, 56, OR, { alpha: kt });
}
function bowl(bx, by, kb, lt) {
  if (kb <= 0) return;
  ctx.save(); ctx.translate(bx, by); ctx.scale(kb, kb);
  ctx.fillStyle = '#FFF7EC'; ctx.beginPath(); ctx.ellipse(0, 0, 170, 70, 0, Math.PI, 0); ctx.fill();
  const r = rng(4); ctx.fillStyle = 'rgba(15,22,48,0.35)'; for (let i = 0; i < 26; i++) { const a = Math.PI + r() * Math.PI, d = r() * 0.85; ctx.save(); ctx.translate(Math.cos(a) * 160 * d, Math.sin(a) * 62 * d); ctx.rotate(r() * 3); ctx.fillRect(-7, -2.5, 14, 5); ctx.restore(); }
  const g = ctx.createLinearGradient(0, 0, 0, 170); g.addColorStop(0, OR); g.addColorStop(1, ORD);
  ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(-200, 0); ctx.lineTo(200, 0); ctx.bezierCurveTo(190, 140, 110, 170, 0, 170); ctx.bezierCurveTo(-110, 170, -190, 140, -200, 0); ctx.fill();
  ctx.fillStyle = ORD; ctx.fillRect(-60, 168, 120, 16);
  ctx.strokeStyle = 'rgba(255,255,255,0.45)'; ctx.lineWidth = 6; ctx.lineCap = 'round';
  for (let i = -1; i <= 1; i++) {
    const ph = (lt * 0.7 + i * 0.33 + 1) % 1; ctx.globalAlpha = Math.sin(ph * Math.PI) * kb;
    ctx.beginPath(); for (let j = 0; j <= 20; j++) { const yy = -90 - j * 6 - ph * 60, xx = i * 70 + Math.sin(j * 0.5 + lt * 4 + i) * 12; j ? ctx.lineTo(xx, yy) : ctx.moveTo(xx, yy); } ctx.stroke();
  }
  ctx.restore();
}

// 2 · MITO (noche profunda)
function s2(lt) {
  const k = seg(lt, 0.2, 0.5), s = lerp(2.6, 1, eOutBack(k));
  if (k > 0) {
    ctx.save(); ctx.translate(CX, 600); ctx.rotate(-0.09); ctx.scale(s, s); ctx.globalAlpha = Math.min(1, k * 3);
    ctx.strokeStyle = OR; ctx.lineWidth = 14; rr(-300, -150, 600, 260, 28); ctx.stroke();
    ctx.lineWidth = 4; rr(-276, -126, 552, 212, 18); ctx.stroke();
    T('MITO', 0, 70, 200, OR); ctx.restore();
  }
  const lines = ['“LOS CARBOHIDRATOS', 'POR LA NOCHE', 'ENGORDAN”'], sz = fit(lines[0], 940, 96);
  lines.forEach((l, i) => {
    const y = 1000 + i * 125;
    const w = words(l, CX, y, sz, '#fff', lt, 0.75 + i * 0.22);
    const ks = eInOutCubic(seg(lt, 2.5 + i * 0.18, 2.85 + i * 0.18));
    if (ks > 0) { ctx.fillStyle = OR; ctx.fillRect(CX - w / 2 - 20, y - sz * 0.36, (w + 40) * ks, 14); }
  });
  T('Uno de los mitos más repetidos del gym', CX, 1440, 40, MUTEDL, { weight: 600, fam: 'Inter', alpha: seg(lt, 1.6, 2.0) });
  const kf = eOutBack(seg(lt, 3.3, 3.7));
  if (kf > 0) { ctx.save(); ctx.translate(CX, 1570); ctx.scale(kf, kf); rr(-170, -50, 340, 84, 42); ctx.fillStyle = OR; ctx.fill(); T('FALSO', 0, 12, 46, NAVY, { ls: 6 }); ctx.restore(); }
}

// 3 · REALIDAD — balanza (crema)
function s3(lt) {
  check(150, 300, 44, seg(lt, 0.1, 0.6));
  words('REALIDAD', 215, 330, 92, NAVY, lt, 0.1, { align: 'left' });
  const L = ['LO QUE MANDA ES', 'TU BALANCE CALÓRICO', 'DEL DÍA. NO LA HORA.'];
  const sz = fit(L[1], 960, 86);
  L.forEach((l, i) => words(l, 60, 480 + i * sz * 1.08, sz, i === 1 ? ORD : NAVY, lt, 0.35 + i * 0.15, { align: 'left', stagger: 0.05 }));
  const px = CX, py = 900, ka = eOutExpo(seg(lt, 0.6, 1.1));
  ctx.save(); ctx.globalAlpha = ka;
  const ang = -0.2 * eOutBack(seg(lt, 1.0, 1.5)) + 0.4 * eOutBack(seg(lt, 2.8, 3.3));
  ctx.fillStyle = NAVY; ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px - 70, py + 330); ctx.lineTo(px + 70, py + 330); ctx.closePath(); ctx.fill();
  rr(px - 160, py + 320, 320, 26, 13); ctx.fill();
  const comes = lt < 2.8 ? lerp(2300, 2600, eOutExpo(seg(lt, 1.0, 1.5))) : lerp(2600, 2000, eOutExpo(seg(lt, 2.8, 3.3)));
  [[-1, 'COMES', comes, OR], [1, 'GASTAS', 2300, NAVY]].forEach(([side, lab, val, col]) => {
    const ex = px + Math.cos(ang) * 340 * side, ey = py + Math.sin(ang) * 340 * side;
    ctx.strokeStyle = 'rgba(15,22,48,0.5)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(ex, ey); ctx.lineTo(ex - 120, ey + 170); ctx.moveTo(ex, ey); ctx.lineTo(ex + 120, ey + 170); ctx.stroke();
    ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(ex, ey + 170, 150, 60, 0, 0, Math.PI); ctx.fill();
    T(lab, ex, ey + 150, 30, NAVY, { font: MONO(30), ls: 2 });
    T(num(val), ex, ey + 300, 56, NAVY);
    T('kcal', ex, ey + 336, 26, MUTED, { weight: 600, fam: 'Inter' });
  });
  ctx.strokeStyle = NAVY; ctx.lineWidth = 18; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(px - Math.cos(ang) * 340, py - Math.sin(ang) * 340); ctx.lineTo(px + Math.cos(ang) * 340, py + Math.sin(ang) * 340); ctx.stroke();
  ctx.fillStyle = OR; circ(px, py, 22); ctx.fill();
  ctx.restore();
  pill('SUPERÁVIT  →  GANAS GRASA', 1470, NAVY, '#fff', seg(lt, 1.4, 1.7) * (1 - seg(lt, 2.6, 2.8)));
  pill('DÉFICIT  →  PIERDES GRASA', 1470, OR, NAVY, seg(lt, 3.2, 3.5));
}

// 4 · ESTUDIO Sofer 2011 (crema)
function s4(lt) {
  tag('ESTUDIO · SOFER ET AL. 2011 · OBESITY', 60, 300, false, seg(lt, 0.05, 0.3));
  words('LO QUE DICE', 60, 430, 96, NAVY, lt, 0.1, { align: 'left', stagger: 0.06 });
  words('LA CIENCIA', 60, 530, 96, ORD, lt, 0.2, { align: 'left', stagger: 0.06 });
  // tarjeta participantes: 78 puntos
  const kc = eOutExpo(seg(lt, 0.35, 0.8));
  card(60, 600, 960, 380, kc);
  ctx.save(); ctx.globalAlpha = kc;
  T('78 adultos con obesidad · 6 meses', 100, 668, 38, NAVY, { weight: 800, align: 'left' });
  T('Misma dieta baja en calorías. Solo cambia', 100, 712, 30, MUTED, { weight: 600, fam: 'Inter', align: 'left' });
  T('cuándo se comen los carbohidratos.', 100, 750, 30, MUTED, { weight: 600, fam: 'Inter', align: 'left' });
  for (let i = 0; i < 78; i++) {
    const col = i % 13, row = Math.floor(i / 13), grpB = col >= 7 || (col === 6 && row >= 3);
    const kd = eOutBack(seg(lt, 0.6 + i * 0.008, 0.9 + i * 0.008));
    const split = eInOutCubic(seg(lt, 1.4, 1.8)) * (grpB ? 40 : 0);
    ctx.fillStyle = grpB && lt > 1.4 ? OR : 'rgba(15,22,48,0.3)';
    circ(130 + col * 52 + split, 800 + row * 26, 9 * kd); ctx.fill();
  }
  const kl = seg(lt, 1.7, 2.0);
  T('Carbos repartidos', 290, 958, 24, MUTED, { font: MONO(24), alpha: kl });
  T('Carbos en la cena', 760, 958, 24, ORD, { font: MONO(24), alpha: kl });
  ctx.restore();
  // resultados grupo cena
  T('RESULTADO DEL GRUPO "CENA":', 60, 1060, 30, NAVY, { font: MONO(30), align: 'left', alpha: seg(lt, 2.0, 2.3) });
  [['MÁS', 'pérdida de peso'], ['MÁS', 'reducción de cintura y grasa'], ['MENOS', 'hambre durante el día']].forEach(([a, b], i) => {
    const t0 = 2.2 + i * 0.35, k = eOutExpo(seg(lt, t0, t0 + 0.4));
    ctx.save(); ctx.globalAlpha = k; ctx.translate((1 - k) * 80, 0);
    const y = 1150 + i * 110;
    rr(60, y - 56, 190, 80, 40); ctx.fillStyle = i < 2 ? OR : NAVY; ctx.fill();
    T(a, 155, y + 0, 38, i < 2 ? NAVY : '#fff');
    T(b, 280, y, 40, NAVY, { weight: 800, align: 'left' });
    ctx.restore();
  });
  const kn = seg(lt, 3.6, 4.0);
  T('Cenar carbohidratos NO frenó la pérdida de grasa.', CX, 1530, 34, NAVY, { weight: 700, fam: 'Inter', alpha: kn });
}

// 5 · DESCANSO Afaghi 2007 (noche con estrellas)
function s5(lt) {
  stars(lt, 45, 11, 0.3);
  const km = eOutBack(seg(lt, 0.1, 0.5));
  ctx.save(); ctx.globalAlpha = km; moon(900, 400, 60, '#FFE7C2'); ctx.restore();
  words('¿Y PARA', 60, 430, 110, '#fff', lt, 0.05, { align: 'left' });
  words('DORMIR?', 60, 545, 110, OR, lt, 0.15, { align: 'left' });
  tag('ESTUDIO · AFAGHI ET AL. 2007 · AJCN', 60, 640, true, seg(lt, 0.4, 0.7));
  T('Tiempo en quedarse dormido', 60, 760, 36, MUTEDL, { weight: 700, fam: 'Inter', align: 'left', alpha: seg(lt, 0.6, 0.9) });
  const bars = [['Cena con arroz de IG bajo', 17.5, 'rgba(255,255,255,0.35)', 0.8], ['Cena con arroz de IG alto', 9.0, OR, 1.2]];
  bars.forEach(([lab, v, col, t0], i) => {
    const y = 850 + i * 190, k = eOutExpo(seg(lt, t0, t0 + 0.9)), maxw = 760;
    T(lab, 60, y, 32, '#fff', { weight: 700, fam: 'Inter', align: 'left', alpha: seg(lt, t0 - 0.1, t0 + 0.2) });
    ctx.fillStyle = 'rgba(255,255,255,0.08)'; rr(60, y + 24, maxw, 70, 35); ctx.fill();
    ctx.fillStyle = col; rr(60, y + 24, Math.max(70, maxw * (v / 17.5) * k), 70, 35); ctx.fill();
    T((v * k).toFixed(1).replace('.', ',') + ' min', 60 + maxw * (v / 17.5) * k + 24, y + 76, 44, '#fff', { align: 'left', alpha: seg(lt, t0, t0 + 0.2) });
  });
  const kb = eOutBack(seg(lt, 2.4, 2.8));
  if (kb > 0) {
    ctx.save(); ctx.translate(CX, 1330); ctx.scale(kb, kb);
    rr(-450, -95, 900, 160, 40); ctx.fillStyle = OR; ctx.fill();
    T('CASI LA MITAD DE TIEMPO', 0, -5, 54, NAVY);
    T('para dormirse', 0, 44, 32, NAVY, { weight: 700, fam: 'Inter' });
    ctx.restore();
  }
  const kn = seg(lt, 3.2, 3.6);
  T('Cena 4 h antes de dormir · 12 hombres sanos', CX, 1500, 28, MUTEDL, { font: MONO(26), alpha: kn });
  T('Efecto real pero moderado: ayuda, no es magia.', CX, 1550, 30, MUTEDL, { weight: 600, fam: 'Inter', alpha: kn });
}

// 6 · LO QUE SÍ IMPORTA (crema)
function s6(lt) {
  words('LO QUE SÍ IMPORTA', 60, 330, 84, NAVY, lt, 0.05, { align: 'left', stagger: 0.06 });
  words('PARA PERDER GRASA', 60, 425, 84, ORD, lt, 0.15, { align: 'left', stagger: 0.06 });
  const items = [
    ['Calorías totales del día', 'Déficit moderado y sostenible'],
    ['Proteína suficiente', '1,6 – 2,2 g por kg de peso'],
    ['Entrenamiento de fuerza', 'Para mantener tu músculo'],
    ['Constancia', 'Semanas, no días sueltos'],
  ];
  items.forEach(([a, b], i) => {
    const y = 560 + i * 170, t0 = 0.5 + i * 0.45, k = seg(lt, t0, t0 + 0.4);
    check(115, y + 36, 40, seg(lt, t0, t0 + 0.5));
    ctx.save(); ctx.globalAlpha = k; ctx.translate((1 - eOutExpo(k)) * 60, 0);
    T(a, 185, y + 50, 48, NAVY, { weight: 900, align: 'left' });
    T(b, 185, y + 98, 32, MUTED, { weight: 600, fam: 'Inter', align: 'left' });
    ctx.restore();
  });
  const y = 560 + 4 * 170, t0 = 2.4, k = seg(lt, t0, t0 + 0.4);
  cross(115, y + 36, 40, seg(lt, t0, t0 + 0.5));
  ctx.save(); ctx.globalAlpha = k * 0.55;
  T('La hora de los carbohidratos', 185, y + 50, 48, NAVY, { weight: 900, align: 'left' });
  const w = mw('La hora de los carbohidratos', 48), ks = eInOutCubic(seg(lt, 2.8, 3.2));
  ctx.fillStyle = OR; ctx.globalAlpha = 1; ctx.fillRect(180, y + 32, (w + 10) * ks, 7);
  ctx.restore();
  const kt = eOutExpo(seg(lt, 3.3, 3.7));
  card(60, 1330, 960, 150, kt, 30, NAVY, 'rgba(15,22,48,0.3)');
  ctx.save(); ctx.globalAlpha = kt;
  T('TRUCO:', 100, 1395, 30, OR, { font: MONO(30), align: 'left' });
  T('cena tus carbos unas horas', 240, 1395, 36, '#fff', { weight: 800, align: 'left' });
  T('antes de acostarte, no justo antes.', 240, 1445, 36, '#fff', { weight: 800, align: 'left' });
  ctx.restore();
}

// 7 · CTA (naranja → crema)
function s7(lt) {
  const L = ['¿QUIERES PERDER', 'GRASA SIN', 'PROHIBIRTE', 'LA CENA?'], sz = fit(L[0], 960, 120);
